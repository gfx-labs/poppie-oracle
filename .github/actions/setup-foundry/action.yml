name: Setup Foundry
description: >
  Install a pinned Foundry release from the official GitHub release tarball and
  verify its SHA-256. Replaces foundry-rs/foundry-toolchain, which the org's
  Actions allow-list does not permit. Linux x86_64 only.

runs:
  using: composite
  steps:
    - name: Install Foundry v1.8.6
      shell: bash
      env:
        FOUNDRY_VERSION: v1.8.6
        # From foundry_v1.8.6_linux_amd64.sha256 published with the release.
        FOUNDRY_SHA256: 58850106984038f3a7200f38a4182c8cb423d3a4f4c7848eacbc2453e6bc35fc
      run: |
        set -euo pipefail
        asset="foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
          "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/${asset}"
        echo "${FOUNDRY_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
        mkdir -p "$HOME/.foundry/bin"
        tar -xzf "$RUNNER_TEMP/$asset" -C "$HOME/.foundry/bin"
        echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
        "$HOME/.foundry/bin/forge" --version
