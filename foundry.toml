[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# evm_version pinned to shanghai (not cancun) to preserve broad chain
# compatibility — no transient storage (TSTORE/TLOAD) or MCOPY is used.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 32

# CI profile: inherits everything from [profile.default], with deeper fuzzing.
# Fork tests (test/fork/**) are excluded via --no-match-path in the workflow.
[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 256
depth = 32
